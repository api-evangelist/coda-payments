note: >-
  Two Coda-published surfaces state the compliance posture differently and both are
  recorded here verbatim rather than reconciled. The corporate security page
  (www.coda.co/security, fetched 2026-08-04) headlines "PCI DSS Level 1 Compliance &
  ISO/IEC 27001:2022 Certification". The technical documentation compliance page
  (docs.coda.co, fetched 2026-08-04) states Coda "processes fewer than the threshold of
  6 million credit and debit card transactions required for the PCI DSS Level 1
  compliance level", "self-assesses its PCI DSS compliance with the SAQ A-EP form and
  self-attests to that compliance annually", "do not have any independent PCI
  certification", and "is currently not certified with ISO 27001 or SOC 2". The docs
  page appears to predate the coda.co rebrand and may be stale; a provider correction is
  the right way to resolve it.
