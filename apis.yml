apis:
- aid: coda-payments:codapay-hosted-payment-page
  name: Codapay Hosted Payment Page API
  description: 'Initiate a payment request, redirect the shopper to Coda''s hosted
    payment page, receive the transaction completion notification, and check transaction
    status. Available as v1.0 (API key per title/country) and v2.0 (global API key
    plus projectId, adds saved-card support). JSON over HTTPS, POST {base}/init.json
    and inquiry endpoints.'
  humanURL: https://docs.coda.co/codapay/hosted-payment-page-integration.md
  baseURL: https://airtime.codapayments.com/airtime/api/restful/v2.0/Payment
  tags:
  - Payments
  - Checkout
  - Hosted Payment Page
  properties:
  - type: Documentation
    url: https://docs.coda.co/codapay/hosted-payment-page-integration.md
  - type: GettingStarted
    url: https://docs.coda.co/codapay/getting-started.md
  - type: Sandbox
    url: https://sandbox.codapayments.com/airtime/api/restful/v2.0/Payment
- aid: coda-payments:codapay-direct-card-api
  name: Codapay Direct Card API
  description: 'Server-to-server card acquiring: submit a charge, retrieve charge data,
    calculate tax, handle 3DS, and create refunds. Authenticated with an Authorization
    header, X-Api-Key and Partner ID over TLS 1.2+.'
  humanURL: https://docs.coda.co/codapay/direct-api-integration.md
  baseURL: https://api-tc.codapayments.com/v1/
  tags:
  - Payments
  - Cards
  - 3DS
  - Refunds
  properties:
  - type: Documentation
    url: https://docs.coda.co/codapay/direct-api-integration/direct-api-integration-for-cards.md
  - type: Sandbox
    url: https://tc-api-card-sandbox.codapayments.com/v1/
- aid: coda-payments:coda-payout-api
  name: Coda Payout API
  description: 'Cross-border payout API for disbursing funds to beneficiaries in local
    currency across markets including Brazil, Colombia, Egypt, India, Indonesia, Mexico,
    Morocco, Nigeria, Pakistan, Saudi Arabia and Turkey. POST /payouts, check payout
    status, check available balance, and receive payout notifications. Authenticated
    with X-API-Key, a JWT bearer token and an x-signature integrity checksum.'
  humanURL: https://docs.coda.co/payout/overview.md
  baseURL: https://payout.codapayments.com
  tags:
  - Payouts
  - Disbursement
  - Cross-Border
  properties:
  - type: Documentation
    url: https://docs.coda.co/payout/integration-guides/api-reference.md
  - type: APIReference
    url: https://docs.coda.co/payout/integration-guides/api-reference/initiate-a-payout-request.md
  - type: Sandbox
    url: https://payout.codapayments-staging.com/
- aid: coda-payments:codashop-fulfillment-api
  name: Codashop and Coda Webstore Fulfillment API
  description: 'The publisher-implemented JSON-RPC fulfillment contract Coda calls
    to deliver purchases made on Codashop and Coda-powered web stores: a Validation
    API request (verify the player/user id), a Top-Up API request (deliver the SKU),
    a UserSync API request, and an optional Fetch Server List request. Requests carry
    an HMAC-SHA256 signature computed over an ordered field concatenation with a shared
    secret key.'
  humanURL: https://docs.coda.co/codashop-and-distribution/integration-guides.md
  baseURL: https://docs.coda.co/codashop-and-distribution/integration-guides.md
  tags:
  - Fulfillment
  - JSON-RPC
  - Gaming
  properties:
  - type: Documentation
    url: https://docs.coda.co/codashop-and-distribution/integration-guides.md
  - type: Authentication
    url: https://docs.coda.co/codashop-and-distribution/integration-guides/authorization.md
