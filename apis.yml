aid: coda-payments
name: Coda Payments
description: 'Coda Payments (trading as Coda, coda.co) is a Singapore-headquartered
  global Merchant of Record and monetization platform for digital content publishers,
  game studios and app developers. Its Codapay API lets partners accept 300+ local
  and global payment methods — cards, e-wallets, direct carrier billing, bank transfer,
  over-the-counter and vouchers — across 65+ countries and 60 currencies through a
  single integration, with Coda taking on Merchant of Record responsibility for tax,
  regulatory compliance, fraud and chargebacks. The developer surface spans the Codapay
  Hosted Payment Page API (v1.0/v2.0), a Direct Card API for server-to-server card
  charges with 3DS, hosted client-side components (CodaCard and CodaComponent JS SDKs),
  a Unity in-app payments SDK, a Refund API, a Payout API for cross-border disbursement,
  and the Codashop / Coda Webstore fulfillment APIs (validation, top-up, user sync)
  that publishers implement so Coda can deliver purchased items into their games.'
